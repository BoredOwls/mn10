name: Build, Test, Release CI for mn10 binary (server) (linux-amd64 & mac-arm64)
run-name: mn10 server release CI ${{ github.event_name }} by ${{ github.actor }}
on:
  push:
    tags:
      - 'v*' # only run on version tags(ex: v1.1.0)

permissions:
  contents: write

jobs:
  release-linux-amd64:
    name: Release CI for mn10 (server)
    runs-on: ubuntu-latest
    env:
      GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
      GH_OWNER: ${{ secrets.GH_OWNER }}
      GH_REPO: ${{ secrets.GH_REPO }}
      GH_ORG: ${{ secrets.GH_ORG }}
    steps:

      - name: checkout repo
        uses: actions/checkout@v5
        with: 
          fetch-depth: 0 #fetch commit logs, etc..

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: npm run server:test

      - name: Build
        run: npm run server:build

      - name: Compress binaries with gz
        run: |
          cd apps/server/dist
          gzip -7 -k mn10-linux-amd64
          gzip -7 -k mn10-darwin-arm64

      - name: Generate changelog (since last tag)
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" > CHANGELOG.md
          else
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" > CHANGELOG.md
          fi

      - name: Release on Github(releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            apps/server/dist/mn10-linux-amd64.gz
            apps/server/dist/mn10-darwin-arm64.gz
